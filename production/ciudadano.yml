services:
    sc-elections-service:
        image: ghcr.io/at-sovereign-technologies/election-query-service:stable
        environment:
            PORT: 8080
            DB_URL: jdbc:postgresql://postgres:5432/${SC_ELECTIONS_DB_NAME}
            DB_USER: ${SC_ELECTIONS_DB_USER}
            DB_PASSWORD: ${SC_ELECTIONS_DB_PASSWORD}
            REDIS_HOST: redis
            REDIS_PORT: 6379
            REDIS_DB: 2
        networks:
            - sello-net-prod
        deploy:
            replicas: 1
            restart_policy:
                condition: on-failure
            placement:
                constraints:
                    - node.labels.type == microservices
                    - node.labels.env == prod

    sc-citizens-service:
